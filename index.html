<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Launch Pad Unlimited | Coming soon</title>
  <meta name="description" content="Launch Pad Unlimited: learning design, AI enablement, evaluation, and exhibit fabrication for museums and informal learning organizations. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <style>
    :root {
      --ink: #fff6e0;       /* warm white, matches the sun */
      --amber: #ffb547;     /* phosphor amber for terminal text */
      --ember: #2a1a08;     /* deep brown for shadows */
      --haze: rgba(42, 26, 8, 0.72);
      --pixel: "Press Start 2P", "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--pixel);
      color: var(--ink);
      background: #3a2810 url("launch-bg.jpg") center / cover no-repeat fixed;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    /* Darken the lower-left so text stays readable over the bright sky */
    .scene {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: max(2rem, env(safe-area-inset-top)) 6vw max(3rem, env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--haze) 0%, rgba(42, 26, 8, 0.25) 45%, transparent 70%);
    }

    h1 {
      font-size: clamp(1.4rem, 5.2vw, 3.6rem);
      line-height: 1.35;
      font-weight: 400;
      text-shadow: 4px 4px 0 var(--ember);
      max-width: 14ch;
    }

    .console {
      margin-top: 2rem;
      font-size: clamp(0.6rem, 1.4vw, 0.9rem);
      line-height: 2.2;
      color: var(--amber);
      text-shadow: 2px 2px 0 var(--ember);
      min-height: 4.4em;
    }

    .console p { white-space: pre-wrap; }

    .cursor {
      display: inline-block;
      width: 0.8em;
      height: 1em;
      margin-left: 0.2em;
      vertical-align: -0.1em;
      background: var(--amber);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    footer {
      margin-top: 2.5rem;
      font-size: 0.55rem;
      line-height: 2;
      color: var(--ink);
      opacity: 0.8;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <h1>Launch Pad Unlimited</h1>

    <div class="console" aria-live="polite">
      <p id="line1"></p>
      <p id="line2"></p>
    </div>

    <footer>
      <p>&copy; <span id="year">2026</span> Launch Pad Unlimited</p>
    </footer>
  </main>

  <script>
    const lines = [
      { el: document.getElementById("line1"), text: "> Systems check..." },
      { el: document.getElementById("line2"), text: "> Stand by for countdown..." }
    ];
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    cursor.setAttribute("aria-hidden", "true");

    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function showAll() {
      lines.forEach(l => (l.el.textContent = l.text));
      lines[lines.length - 1].el.appendChild(cursor);
    }

    function type(i = 0, c = 0) {
      if (i >= lines.length) return;
      const { el, text } = lines[i];
      el.textContent = text.slice(0, c);
      el.appendChild(cursor);
      if (c < text.length) {
        setTimeout(() => type(i, c + 1), 70);
      } else {
        setTimeout(() => type(i + 1, 0), 900);
      }
    }

    reduce ? showAll() : setTimeout(type, 600);
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
